name: Automatyczny Build APK (CI/CD)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # Uruchom tworzenie Release po dodaniu tagu np. v1.0.0
  workflow_dispatch: # Pozwala uruchomić akcję ręcznie z poziomu GitHub Actions

permissions:
  contents: write # Potrzebne do tworzenia zakładki Release

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium (Checkout)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności i budowa Vite (dist)
        run: |
          npm install
          npm run build

      - name: Generowanie i synchronizacja projektu Android (Capacitor)
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Nadanie uprawnień dla pliku gradlew i kompilacja APK (Assemble Debug)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Zapisz APK jako Artefakt w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: chemicats-super-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publikacja APK do zakładki Releases (przy tagach v*)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          name: Chemicats Super ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
